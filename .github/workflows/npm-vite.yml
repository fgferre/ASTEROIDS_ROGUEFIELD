name: Node.js CI

# Pull requests only: on main, deploy.yml runs the same gates before publishing.
on:
  pull_request:
    branches: ['main']

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Whole history: the changelog's check compares a pull request with the
      # point where it left main (tests/process/changelogLine.test.js).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Node pinned in .nvmrc, the one the tests run on at home too.
      - name: Use the Node pinned in .nvmrc
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
