name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deployments
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      # The site goes up only if the same gates as CI pass: a red main stays
      # unpublished (it used to deploy in ~45 s, before CI had finished).
      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      # The original Canvas 2D game, kept as it was (tag classic-2d), served
      # next to the current game under /classic/; the credits link to it.
      - name: Checkout the original 2D game (tag classic-2d)
        uses: actions/checkout@v4
        with:
          ref: classic-2d
          path: classic-src

      - name: Build the original 2D game into dist/classic
        working-directory: classic-src
        run: |
          npm ci
          npx vite build --base /ASTEROIDS_ROGUEFIELD/classic/ --outDir "$GITHUB_WORKSPACE/dist/classic" --emptyOutDir

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # Publishing is its own job, as in GitHub's Pages template: run in the same
  # job right after the upload, the deploy twice found no package to publish
  # ("Found 0 artifact(s)", 21/11/2026). If it still misses, it waits and
  # tries once more.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before trying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (second try)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
